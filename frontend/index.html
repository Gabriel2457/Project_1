<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>This will be an awesome app!</h1>

        <button type="button" onclick="loadMovies()">Load movies</button>

        <h3>The movies available in the app are:</h3>

        <div>
            <p>Insert the movie details</p>

            <form id="movieForm">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>

                <label for="year">Year:</label>
                <input type="number" id="year" name="year" required>

                <label for="director">Director:</label>
                <input type="text" id="director" name="director" required>

                <label for="genre">Genre:</label>
                <input type="text" id="genre" name="genre">

                <label for="synopsis">Synopsis:</label>
                <textarea id="synopsis" name="synopsis"></textarea>

                <label for="duration">Duration (minutes):</label>
                <input type="number" id="duration" name="duration">

                <label for="poster">Poster URL:</label>
                <input type="url" id="poster" name="poster">

                <button type="submit">Add movie</button>
            </form>
        </div>

        <div id="moviesContainer">
            <p>Nothing loaded yet - click on the button to load the movies</p>
        </div>
    </div>
</body>
</html>
